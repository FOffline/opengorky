# Builds the macOS, Linux and Windows packages (scripts/dist-*.sh): the game and, as
# separate assets, the level editor (OpenGorky-Editor-*, opengorky-editor-*). A pushed v* tag, or a
# manual run with a `tag` (created on the selected commit), publishes them as a GitHub
# release; asset names don't change between versions, so the site can link
# https://github.com/<owner>/<repo>/releases/latest/download/<asset>.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.1 (empty: build only)"
        required: false

# Build jobs only read the repo; just the release job may write.
permissions:
  contents: read

env:
  ZIG: 0.17.0
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  macos:
    runs-on: macos-15
    env:
      # Secrets can't be tested in `if:`; without them the build stays ad-hoc signed.
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe → the version in Info.plist
          persist-credentials: false
      - name: Local tag # git describe → the release version in Info.plist
        if: inputs.tag != ''
        run: | # fails early on a bad tag or one already on another commit, so no release is touched
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' || { echo "bad tag: $TAG" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            [ "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" ] || { echo "tag $TAG is on another commit" >&2; exit 1; }
          else
            git tag "$TAG"
          fi
      - name: Zig
        run: |
          curl -sSLf --retry 5 --retry-all-errors https://ziglang.org/download/$ZIG/zig-aarch64-macos-$ZIG.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-$ZIG" >> "$GITHUB_PATH"
      - name: Developer ID keychain
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"
          PW=$(openssl rand -hex 16)
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials opengorky --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          ID=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          [ -n "$ID" ] || { echo "no Developer ID Application identity in the .p12" >&2; exit 1; }
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=opengorky" >> "$GITHUB_ENV"
      - run: scripts/dist-macos.sh
      - name: Remove keychain
        if: always() && env.HAS_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/sign.keychain-db" || true
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: zig-out/dist/*.zip

  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/dist-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.runner }}
          path: zig-out/dist/*.tar.xz

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/dist-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: zig-out/dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog reads the history since the previous tag
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Changelog # commit subjects since the previous v* tag (the whole history for the first)
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag "$TAG" "$GITHUB_SHA"
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          { echo "## Changes${prev:+ since $prev}"; echo; git log --no-merges --pretty='- %s (%h)' ${prev:+"$prev.."}"$TAG"; } > notes.md
          cat notes.md
      # An existing release (a rerun, a manual run on the same commit) gets the new assets
      # and notes; otherwise --target creates the tag on the built commit.
      - run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
